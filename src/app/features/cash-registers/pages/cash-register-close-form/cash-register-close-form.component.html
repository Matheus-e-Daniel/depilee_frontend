<div class="modal-backdrop" *ngIf="visible">
  <div class="confirmation-modal-card cash-register-close-modal-card">
    <button type="button" class="close-btn" (click)="onCancel()" pButton pTooltip="Fechar" tooltipPosition="left">
      <i class="pi pi-times"></i>
    </button>

    <div class="icon-container">
      <i class="pi pi-wallet"></i>
    </div>

    <h2 class="modal-title">Fechar Caixa</h2>

    <form [formGroup]="form" (ngSubmit)="onConfirm()" class="close-form">
      <div class="field">
        <label for="finalBalance" class="block font-medium mb-2">Saldo Final *</label>
        <input
          id="finalBalance"
          type="number"
          step="0.01"
          pInputText
          formControlName="finalBalance"
          class="w-full"
          placeholder="R$ 0,00" />
        <small
          *ngIf="form.get('finalBalance')?.invalid && form.get('finalBalance')?.touched"
          class="p-error block mt-1">
          <span *ngIf="form.get('finalBalance')?.errors?.['required']">Saldo final é obrigatório</span>
        </small>
      </div>

      <div class="field">
        <label for="notes" class="block font-medium mb-2">Observações</label>
        <textarea
          id="notes"
          pInputText
          formControlName="notes"
          class="w-full"
          rows="3"
          placeholder="Digite observações (opcional)"></textarea>
      </div>

      <div class="actions">
        <button pButton type="button" label="Cancelar" class="p-button-text" [disabled]="loading" (click)="onCancel()"></button>
        <button pButton type="submit" label="Fechar Caixa" class="p-button-primary" [disabled]="form.invalid || loading" [loading]="loading"></button>
      </div>
    </form>
  </div>
</div>
