<div class="modal-backdrop" *ngIf="visible">
  <div class="confirmation-modal-card profile-modal-card">
    <button type="button" class="close-btn" (click)="onCancel()" pButton pTooltip="Fechar" tooltipPosition="left">
      <i class="pi pi-times"></i>
    </button>

    <div class="icon-container">
      <i class="pi pi-key"></i>
    </div>

    <h2 class="modal-title">Alterar Senha</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="profile-form">
      <div class="field">
        <label for="newPassword">Nova senha *</label>
        <div class="password-field">
          <input
            id="newPassword"
            formControlName="newPassword"
            [type]="showNewPassword() ? 'text' : 'password'"
            pInputText
            class="w-full"
            placeholder="Digite a nova senha" />
          <button
            type="button"
            class="toggle-password-btn"
            pButton
            pTooltip="{{ showNewPassword() ? 'Ocultar senha' : 'Mostrar senha' }}"
            tooltipPosition="top"
            (click)="toggleNewPasswordVisibility()">
            <i class="pi" [ngClass]="showNewPassword() ? 'pi-eye-slash' : 'pi-eye'"></i>
          </button>
        </div>
        <small *ngIf="form.get('newPassword')?.invalid && form.get('newPassword')?.touched" class="p-error block mt-1">
          A senha deve ter pelo menos 6 caracteres
        </small>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirmar nova senha *</label>
        <div class="password-field">
          <input
            id="confirmPassword"
            formControlName="confirmPassword"
            [type]="showConfirmPassword() ? 'text' : 'password'"
            pInputText
            class="w-full"
            placeholder="Repita a nova senha" />
          <button
            type="button"
            class="toggle-password-btn"
            pButton
            pTooltip="{{ showConfirmPassword() ? 'Ocultar senha' : 'Mostrar senha' }}"
            tooltipPosition="top"
            (click)="toggleConfirmPasswordVisibility()">
            <i class="pi" [ngClass]="showConfirmPassword() ? 'pi-eye-slash' : 'pi-eye'"></i>
          </button>
        </div>
        <small *ngIf="form.errors?.['passwordMismatch'] && form.get('confirmPassword')?.touched" class="p-error block mt-1">
          As senhas não coincidem
        </small>
      </div>

      <div class="form-actions">
        <button
          pButton
          type="button"
          label="Cancelar"
          class="p-button-text"
          [disabled]="loading()"
          (click)="onCancel()">
        </button>
        <button
          pButton
          type="submit"
          label="Alterar Senha"
          [loading]="loading()"
          [disabled]="loading()">
        </button>
      </div>
    </form>
  </div>
</div>
