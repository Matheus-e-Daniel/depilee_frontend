<div class="profile-page-container w-full">
  <div class="header">
    <div class="title-section">
      <h1>Meu Perfil</h1>
      <p>Visualize e edite suas informações de conta</p>
    </div>
  </div>

  <div class="card">
    <p-card>
      <ng-container *ngIf="!editing()">
        <div class="profile-view">
          <div class="profile-field">
            <span class="profile-label">Nome completo</span>
            <span class="profile-value">{{ profile()?.fullName || '—' }}</span>
          </div>

          <div class="profile-field">
            <span class="profile-label">Email (login)</span>
            <span class="profile-value">{{ profile()?.email || '—' }}</span>
          </div>

          <div class="profile-actions">
            <button
              pButton
              type="button"
              icon="pi pi-key"
              label="Alterar Senha"
              class="p-button-outlined"
              [disabled]="loading()"
              (click)="openChangePassword()">
            </button>
            <button
              pButton
              type="button"
              icon="pi pi-pencil"
              label="Editar"
              [disabled]="loading()"
              (click)="startEditing()">
            </button>
          </div>
        </div>
      </ng-container>

      <form *ngIf="editing()" [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="profile-form">
        <div class="field">
          <label for="fullName">Nome completo *</label>
          <input
            id="fullName"
            formControlName="fullName"
            type="text"
            pInputText
            class="w-full"
            placeholder="Digite o nome completo" />
          <small *ngIf="profileForm.get('fullName')?.invalid && profileForm.get('fullName')?.touched" class="p-error block mt-1">
            Nome completo é obrigatório
          </small>
        </div>

        <div class="field">
          <label for="email">Email (login) *</label>
          <input
            id="email"
            formControlName="email"
            type="email"
            pInputText
            class="w-full"
            placeholder="Digite o email" />
          <small *ngIf="profileForm.get('email')?.invalid && profileForm.get('email')?.touched" class="p-error block mt-1">
            <span *ngIf="profileForm.get('email')?.errors?.['required']">Email é obrigatório</span>
            <span *ngIf="profileForm.get('email')?.errors?.['email']">Email inválido</span>
          </small>
        </div>

        <div class="form-actions">
          <button
            pButton
            type="button"
            label="Cancelar"
            class="p-button-text"
            [disabled]="saving()"
            (click)="cancelEditing()">
          </button>
          <button
            pButton
            type="submit"
            label="Salvar"
            [loading]="saving()"
            [disabled]="saving()">
          </button>
        </div>
      </form>
    </p-card>
  </div>
</div>

<app-change-password-modal
  [visible]="showChangePassword()"
  [profile]="profile()"
  (closed)="closeChangePassword()">
</app-change-password-modal>

<app-success-modal
  [visible]="successModalService.visible()"
  [message]="successModalService.message()"
  (visibleChange)="successModalService.hide()">
</app-success-modal>
