<div class="modal-backdrop" *ngIf="visible">
  <div class="confirmation-modal-card profile-modal-card">
    <button type="button" class="close-btn" (click)="onCancel()" pButton pTooltip="Fechar" tooltipPosition="left">
      <i class="pi pi-times"></i>
    </button>

    <div class="icon-container">
      <i class="pi pi-user"></i>
    </div>

    <h2 class="modal-title">Meu Perfil</h2>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="profile-form">
      <div class="field">
        <label for="fullName">Nome completo *</label>
        <input
          id="fullName"
          formControlName="fullName"
          type="text"
          pInputText
          class="w-full"
          placeholder="Digite o nome completo" />
        <small *ngIf="profileForm.get('fullName')?.invalid && profileForm.get('fullName')?.touched" class="p-error block mt-1">
          Nome completo é obrigatório
        </small>
      </div>

      <div class="field">
        <label for="email">Email (login) *</label>
        <input
          id="email"
          formControlName="email"
          type="email"
          pInputText
          class="w-full"
          placeholder="Digite o email" />
        <small *ngIf="profileForm.get('email')?.invalid && profileForm.get('email')?.touched" class="p-error block mt-1">
          <span *ngIf="profileForm.get('email')?.errors?.['required']">Email é obrigatório</span>
          <span *ngIf="profileForm.get('email')?.errors?.['email']">Email inválido</span>
        </small>
      </div>

      <div class="field section-divider">
        <span class="section-label">Alterar senha (opcional)</span>
      </div>

      <div class="field">
        <label for="newPassword">Nova senha</label>
        <div class="password-field">
          <input
            id="newPassword"
            formControlName="newPassword"
            [type]="showNewPassword() ? 'text' : 'password'"
            pInputText
            class="w-full"
            placeholder="Deixe em branco para não alterar" />
          <button
            type="button"
            class="toggle-password-btn"
            pButton
            pTooltip="{{ showNewPassword() ? 'Ocultar senha' : 'Mostrar senha' }}"
            tooltipPosition="top"
            (click)="toggleNewPasswordVisibility()">
            <i class="pi" [ngClass]="showNewPassword() ? 'pi-eye-slash' : 'pi-eye'"></i>
          </button>
        </div>
        <small *ngIf="profileForm.get('newPassword')?.value && profileForm.get('newPassword')!.value!.length < 6" class="p-error block mt-1">
          A senha deve ter pelo menos 6 caracteres
        </small>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirmar nova senha</label>
        <div class="password-field">
          <input
            id="confirmPassword"
            formControlName="confirmPassword"
            [type]="showConfirmPassword() ? 'text' : 'password'"
            pInputText
            class="w-full"
            placeholder="Repita a nova senha" />
          <button
            type="button"
            class="toggle-password-btn"
            pButton
            pTooltip="{{ showConfirmPassword() ? 'Ocultar senha' : 'Mostrar senha' }}"
            tooltipPosition="top"
            (click)="toggleConfirmPasswordVisibility()">
            <i class="pi" [ngClass]="showConfirmPassword() ? 'pi-eye-slash' : 'pi-eye'"></i>
          </button>
        </div>
        <small *ngIf="profileForm.errors?.['passwordMismatch'] && profileForm.get('confirmPassword')?.touched" class="p-error block mt-1">
          As senhas não coincidem
        </small>
      </div>

      <div class="form-actions">
        <button
          pButton
          type="button"
          label="Cancelar"
          class="p-button-text"
          [disabled]="loading()"
          (click)="onCancel()">
        </button>
        <button
          pButton
          type="submit"
          label="Salvar"
          [loading]="loading()"
          [disabled]="loading()">
        </button>
      </div>
    </form>
  </div>
</div>

<app-success-modal [visible]="successModalService.visible()" [message]="successModalService.message()" (visibleChange)="successModalService.hide()"></app-success-modal>
