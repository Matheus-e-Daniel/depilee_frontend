<div class="user-list-container w-full">
  <div class="header">
    <div class="title-section">
      <h1>Usuários</h1>
      <p>Gerencie os usuários do sistema</p>
    </div>
    <button
      pButton
      icon="pi pi-plus"
      label="Novo Usuário"
      class="p-button-primary"
      [class.not-clickable]="!hasPermission('Identity.Create')"
      [attr.disabled]="!hasPermission('Identity.Create') ? true : null"
      (click)="hasPermission('Identity.Create') && newUser()">
    </button>
  </div>

  @if (selectedUsers().length > 0 && hasPermission('Identity.Delete')) {
    <button
      pButton
      icon="pi pi-trash"
      [label]="'Excluir selecionados (' + selectedUsers().length + ')'"
      class="p-button-danger p-button-sm bulk-delete-btn"
      (click)="deleteSelected()">
    </button>
  }

  <div class="card">
    <p-table
      [value]="users()"
      [loading]="loading()"
      [(selection)]="selectedUsers"
      dataKey="id"
      selectionMode="multiple"
      styleClass="p-datatable-striped responsive-table"
      [paginator]="true"
      [rows]="10"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} usuários">

      <ng-template pTemplate="header">
        <tr>
          <th style="width: 3rem"><p-tableHeaderCheckbox></p-tableHeaderCheckbox></th>
          <th>Email</th>
          <th>Nome completo</th>
          <th>Situação</th>
          <th>Ações</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-user>
        <tr>
          <td style="width: 3rem"><p-tableCheckbox [value]="user"></p-tableCheckbox></td>
          <td data-label="Email">{{ user.email }}</td>
          <td data-label="Nome completo">{{ user.fullName }}</td>
          <td data-label="Situação">
            <p-tag
              [value]="user.isDeleted ? 'Inativo' : 'Ativo'"
              [severity]="user.isDeleted ? 'danger' : 'success'"
              class="mr-1">
            </p-tag>
          </td>
          <td data-label="Ações">
            <div class="action-buttons">
              <button
                pButton
                icon="pi pi-pencil"
                class="p-button-sm p-button-primary mr-2"
                pTooltip="Editar"
                tooltipPosition="top"
                [class.not-clickable]="!hasPermission('Identity.Edit')"
                [attr.disabled]="!hasPermission('Identity.Edit') ? true : null"
                (click)="hasPermission('Identity.Edit') && editUser(user.id)">
              </button>
              <button
                pButton
                icon="pi pi-trash"
                class="p-button-sm p-button-danger"
                pTooltip="Excluir"
                tooltipPosition="top"
                [class.not-clickable]="!hasPermission('Identity.Delete')"
                [attr.disabled]="!hasPermission('Identity.Delete') ? true : null"
                (click)="hasPermission('Identity.Delete') && deleteUser(user.id, user.fullName)">
              </button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" class="text-center py-5">
            <div class="empty-state">
              <i class="pi pi-users" style="font-size: 3rem; color: #ccc"></i>
              <h3>Nenhum usuário encontrado</h3>
              <p>Comece adicionando seu primeiro usuário</p>
              <button
                pButton
                icon="pi pi-plus"
                label="Novo Usuário"
                class="p-button-outlined mt-3"
                [class.not-clickable]="!hasPermission('Identity.Create')"
                [attr.disabled]="!hasPermission('Identity.Create') ? true : null"
                (click)="hasPermission('Identity.Create') && newUser()">
              </button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<app-confirmation-modal
  [visible]="!!userToDelete"
  [type]="'delete'"
  [loading]="confirmationLoading()"
  [message]="getDeleteMessage()"
  (confirm)="confirmDelete()"
  (cancelled)="cancelDelete()">
</app-confirmation-modal>

<app-confirmation-modal
  [visible]="bulkDeleteVisible()"
  [type]="'delete'"
  [loading]="bulkDeleteLoading()"
  [message]="getBulkDeleteMessage()"
  (confirm)="confirmBulkDelete()"
  (cancelled)="cancelBulkDelete()">
</app-confirmation-modal>

<app-success-modal
  [visible]="successModalService.visible()"
  [loading]="successModalService.loading()"
  [message]="successModalService.message()"
  (visibleChange)="successModalService.hide()">
</app-success-modal>
