<div class="brand-list-container w-full">

  <div class="header">
    <div class="title-section">
      <h1>Marcas</h1>
      <p>Gerencie seu cadastro de marcas</p>
    </div>
    <button
      pButton
      icon="pi pi-plus"
      label="Nova Marca"
      class="p-button-primary"
      [class.not-clickable]="!hasPermission('Brand.Create')"
      [attr.disabled]="!hasPermission('Brand.Create') ? true : null"
      (click)="hasPermission('Brand.Create') && newBrand()">
    </button>
  </div>

  <div class="filters-card">
    <div class="filters-header">
      <div class="filters-title">
        <i class="pi pi-filter"></i>
        <h3>Filtros</h3>
      </div>
      <button
        pButton
        icon="pi pi-times"
        label="Limpar Filtros"
        class="p-button-text p-button-sm clear-filters-btn"
        (click)="searchValue = ''; sortOrderValue = 'desc';">
      </button>
    </div>

    @if (selectedBrands().length > 0 && hasPermission('Brand.Delete')) {
      <button
        pButton
        icon="pi pi-trash"
        [label]="'Excluir selecionados (' + selectedBrands().length + ')'"
        class="p-button-danger p-button-sm bulk-delete-btn"
        (click)="deleteSelected()">
      </button>
    }
    <div class="filters-content">
      <div class="filter-group">
        <label for="brandSearch">Buscar por nome</label>
        <span class="p-input-icon-right w-full">
          <input
            id="brandSearch"
            type="text"
            pInputText
            placeholder="Digite o nome da marca..."
            [ngModel]="searchValue"
            (ngModelChange)="searchValue = $event"
            class="w-full brand-search-input"
          />
        </span>
      </div>
      <div class="filter-group">
        <label for="brandSort">Ordenar por</label>
        <p-dropdown
          id="brandSort"
          [options]="sortOptions"
          [ngModel]="sortOrderValue"
          (ngModelChange)="sortOrderValue = $event"
          optionLabel="label"
          optionValue="value"
          placeholder="Selecione a ordenação"
          class="w-full"
        ></p-dropdown>
      </div>
    </div>
  </div>

  <div class="card">
    <p-table
      [value]="filteredBrands()"
      [(selection)]="selectedBrands"
      dataKey="id"
      selectionMode="multiple"
      [loading]="loading()"
      styleClass="p-datatable-striped responsive-table"
      [paginator]="true"
      [rows]="10"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} marcas">

      <ng-template pTemplate="header">
        <tr>
          <th style="width: 3rem"><p-tableHeaderCheckbox></p-tableHeaderCheckbox></th>
          <th>Nome</th>
          <th>Situação</th>
          <th>Ações</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-brand>
        <tr>
          <td style="width: 3rem"><p-tableCheckbox [value]="brand"></p-tableCheckbox></td>
          <td data-label="Nome">{{ brand.name }}</td>
          <td data-label="Situação">
            <p-tag
              [value]="brand.status === 1 ? 'Ativo' : 'Inativo'"
              [severity]="brand.status === 1 ? 'success' : 'danger'"
              class="mr-1">
            </p-tag>
          </td>
          <td data-label="Ações">
            <div class="action-buttons">
              <button
                pButton
                icon="pi pi-pencil"
                class="p-button-sm p-button-primary mr-2"
                pTooltip="Editar"
                tooltipPosition="top"
                [class.not-clickable]="!hasPermission('Brand.Edit')"
                [attr.disabled]="!hasPermission('Brand.Edit') ? true : null"
                (click)="hasPermission('Brand.Edit') && editBrand(brand.id)">
              </button>
              <button
                pButton
                icon="pi pi-trash"
                class="p-button-sm p-button-danger"
                pTooltip="Excluir"
                tooltipPosition="top"
                [class.not-clickable]="!hasPermission('Brand.Delete')"
                [attr.disabled]="!hasPermission('Brand.Delete') ? true : null"
                (click)="hasPermission('Brand.Delete') && deleteBrand(brand.id, brand.name)">
              </button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" class="text-center py-5">
            <div class="empty-state">
              <i class="pi pi-tag" style="font-size: 3rem; color: #ccc"></i>
              <h3>Nenhuma marca encontrada</h3>
              <p>Comece adicionando sua primeira marca</p>
              <button
                pButton
                icon="pi pi-plus"
                label="Nova Marca"
                class="p-button-outlined mt-3"
                [class.not-clickable]="!hasPermission('Brand.Create')"
                [attr.disabled]="!hasPermission('Brand.Create') ? true : null"
                (click)="hasPermission('Brand.Create') && newBrand()">
              </button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<app-confirmation-modal
  [visible]="showConfirmation()"
  type="delete"
  [message]="getDeleteMessage()"
  confirmLabel="Excluir"
  cancelLabel="Cancelar"
  [loading]="confirmationLoading()"
  (confirm)="confirmDelete()"
  (cancelled)="cancelDelete()">
</app-confirmation-modal>

<app-confirmation-modal
  [visible]="bulkDeleteVisible()"
  type="delete"
  [message]="getBulkDeleteMessage()"
  confirmLabel="Excluir"
  cancelLabel="Cancelar"
  [loading]="bulkDeleteLoading()"
  (confirm)="confirmBulkDelete()"
  (cancelled)="cancelBulkDelete()">
</app-confirmation-modal>

<app-success-modal
  [visible]="successModalService.visible()"
  [loading]="successModalService.loading()"
  [message]="successModalService.message()"
  (visibleChange)="successModalService.hide()">
</app-success-modal>
