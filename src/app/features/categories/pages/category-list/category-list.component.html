<div class="category-list-container w-full">
  <div class="header">
    <div class="title-section">
      <h1>Categorias</h1>
      <p>Gerencie seu cadastro de categorias</p>
    </div>
    <button
      pButton
      icon="pi pi-plus"
      label="Nova Categoria"
      class="p-button-primary"
      [class.not-clickable]="!hasPermission('Category.Create')"
      [attr.disabled]="!hasPermission('Category.Create') ? true : null"
      (click)="hasPermission('Category.Create') && newCategory()">
    </button>
  </div>

  <div class="filters-card">
    <div class="filters-header">
      <div class="filters-title">
        <i class="pi pi-filter"></i>
        <h3>Filtros</h3>
      </div>
      <button
        pButton
        icon="pi pi-times"
        label="Limpar Filtros"
        class="p-button-text p-button-sm clear-filters-btn"
        (click)="searchValue = ''; sortOrderValue = 'desc';">
      </button>
    </div>

    @if (selectedCategories().length > 0 && hasPermission('Category.Delete')) {
      <button
        pButton
        icon="pi pi-trash"
        [label]="'Excluir selecionados (' + selectedCategories().length + ')'"
        class="p-button-danger p-button-sm bulk-delete-btn"
        (click)="deleteSelected()">
      </button>
    }
    <div class="filters-content">
      <div class="filter-group">
        <label for="categorySearch">Buscar por nome</label>
        <span class="p-input-icon-right w-full">
          <input
            id="categorySearch"
            type="text"
            pInputText
            placeholder="Digite o nome da categoria..."
            [ngModel]="searchValue"
            (ngModelChange)="searchValue = $event"
            class="w-full category-search-input"
          />
        </span>
      </div>
      <div class="filter-group">
        <label for="categorySort">Ordenar por</label>
        <p-dropdown
          id="categorySort"
          [options]="sortOptions"
          [ngModel]="sortOrderValue"
          (ngModelChange)="sortOrderValue = $event"
          optionLabel="label"
          optionValue="value"
          placeholder="Selecione a ordenação"
          class="w-full"
        ></p-dropdown>
      </div>
    </div>
  </div>

  <div class="card">
    <p-table
      [value]="filteredCategories()"
      [loading]="loading()"
      [(selection)]="selectedCategories"
      dataKey="id"
      selectionMode="multiple"
      styleClass="p-datatable-striped responsive-table"
      [paginator]="true"
      [rows]="10"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} categorias">

      <ng-template pTemplate="header">
        <tr>
          <th style="width: 3rem"><p-tableHeaderCheckbox></p-tableHeaderCheckbox></th>
          <th>Nome</th>
          <th>Descrição</th>
          <th>Situação</th>
          <th>Ações</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-category>
        <tr>
          <td style="width: 3rem"><p-tableCheckbox [value]="category"></p-tableCheckbox></td>
          <td data-label="Nome">{{ category.name }}</td>
          <td data-label="Descrição">{{ category.description || '-' }}</td>
          <td data-label="Situação">
            <p-tag
              [value]="category.status === 1 ? 'Ativo' : 'Inativo'"
              [severity]="category.status === 1 ? 'success' : 'danger'"
              class="mr-1">
            </p-tag>
          </td>
          <td data-label="Ações">
            <div class="action-buttons">
              <button
                pButton
                icon="pi pi-pencil"
                class="p-button-sm p-button-primary mr-2"
                pTooltip="Editar"
                tooltipPosition="top"
                [class.not-clickable]="!hasPermission('Category.Edit')"
                [attr.disabled]="!hasPermission('Category.Edit') ? true : null"
                (click)="hasPermission('Category.Edit') && editCategory(category.id)">
              </button>
              <button
                pButton
                icon="pi pi-trash"
                class="p-button-sm p-button-danger"
                pTooltip="Excluir"
                tooltipPosition="top"
                [class.not-clickable]="!hasPermission('Category.Delete')"
                [attr.disabled]="!hasPermission('Category.Delete') ? true : null"
                (click)="hasPermission('Category.Delete') && deleteCategory(category.id, category.name)">
              </button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" class="text-center py-5">
            <div class="empty-state">
              <i class="pi pi-list" style="font-size: 3rem; color: #ccc"></i>
              <h3>Nenhuma categoria encontrada</h3>
              <p>Comece adicionando sua primeira categoria</p>
              <button
                pButton
                icon="pi pi-plus"
                label="Nova Categoria"
                class="p-button-outlined mt-3"
                [class.not-clickable]="!hasPermission('Category.Create')"
                [attr.disabled]="!hasPermission('Category.Create') ? true : null"
                (click)="hasPermission('Category.Create') && newCategory()">
              </button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<app-confirmation-modal
  [visible]="!!categoryToDelete"
  [type]="'delete'"
  [loading]="confirmationLoading()"
  [message]="getDeleteMessage()"
  (confirm)="confirmDelete()"
  (cancelled)="cancelDelete()">
</app-confirmation-modal>

<app-confirmation-modal
  [visible]="bulkDeleteVisible()"
  [type]="'delete'"
  [loading]="bulkDeleteLoading()"
  [message]="getBulkDeleteMessage()"
  (confirm)="confirmBulkDelete()"
  (cancelled)="cancelBulkDelete()">
</app-confirmation-modal>

<app-success-modal
  [visible]="successModalService.visible()"
  [loading]="successModalService.loading()"
  [message]="successModalService.message()"
  (visibleChange)="successModalService.hide()">
</app-success-modal>
